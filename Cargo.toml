[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Farquaad56/CPU-Zilog-Z80_Crates_Rust"
homepage = "https://github.com/Farquaad56/CPU-Zilog-Z80_Crates_Rust"
authors = ["Farquaad56"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false

[profile.test]
opt-level = 2
