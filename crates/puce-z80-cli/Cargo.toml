[package]
name = "puce-z80-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Z80 emulator CLI tool (run, cpm, suite, ssc, fuse, z80test, disasm, fetch)"

[[bin]]
name = "z80"
path = "src/main.rs"

[dependencies]
puce-z80-machines = { path = "../puce-z80-machines" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
