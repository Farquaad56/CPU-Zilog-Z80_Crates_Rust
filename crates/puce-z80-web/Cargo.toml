[package]
name = "puce-z80-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Z80 emulator web frontend server (HTTP + WebSocket)"

[[bin]]
name = "z80-web"
path = "src/main.rs"

[dependencies]
puce-z80 = { path = "../puce-z80", features = ["inspect", "disasm", "std"] }
puce-z80-machines = { path = "../puce-z80-machines" }
tiny_http = "0.12"
tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
